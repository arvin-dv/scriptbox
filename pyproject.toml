[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scriptbox"
version = "0.1.0"
description = "A collection of small, handy, and robust Python CLI utilities and scripts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Arvin Aidrian D. Villamor", email = "2022100502@ms.bulsu.edu.ph" }
]
keywords = [
    "cli",
    "utilities",
    "developer-tools",
    "sysadmin",
    "productivity",
    "scripts"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0"
]
yaml = [
    "pyyaml>=6.0.1"
]
toml = [
    "tomli-w>=1.0.0"
]
all = [
    "scriptbox[dev,yaml,toml]"
]

[project.scripts]
scriptbox = "scriptbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"
